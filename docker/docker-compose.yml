version: '3.8'

# Soccer Predictions Platform - Local Development Environment
# This Docker Compose configuration sets up all services needed for local development

services:
  # PostgreSQL Database - Multi-Schema Architecture
  postgres:
    image: postgres:15-alpine
    container_name: soccer_predictions_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: soccer_predictions
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/conf:/etc/postgresql/conf.d:ro
    networks:
      - predictions_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soccer_predictions"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=200
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  # Redis Cache - Session Management & Caching
  redis:
    image: redis:7-alpine
    container_name: soccer_predictions_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - predictions_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server /usr/local/etc/redis/redis.conf

  # Adminer - Database Management UI
  adminer:
    image: adminer:latest
    container_name: soccer_predictions_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    networks:
      - predictions_network
    depends_on:
      postgres:
        condition: service_healthy

  # Backend API (FastAPI) - To be implemented
  # Uncomment when backend is ready
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: soccer_predictions_backend
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/soccer_predictions
  #     - REDIS_URL=redis://redis:6379/0
  #     - ENVIRONMENT=development
  #     - DEBUG=true
  #     - SECRET_KEY=your-secret-key-change-in-production
