  #     - EXPERT_TOOLS_ENABLED=true
  #     - ADMIN_FEATURES_ENABLED=true
  #   volumes:
  #     - ./backend:/app
  #     - ml_models:/app/ml/models
  #     - expert_data:/app/expert/data
  #   networks:
  #     - predictions_network
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

# Docker Networks
networks:
  predictions_network:
    driver: bridge
    name: soccer_predictions_network
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Docker Volumes
volumes:
  postgres_data:
    name: soccer_predictions_postgres_data
    driver: local
  redis_data:
    name: soccer_predictions_redis_data
    driver: local
