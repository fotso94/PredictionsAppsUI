# PostgreSQL Configuration for Soccer Predictions Platform
# Optimized for local development with moderate data volumes

# ============================================================================
# CONNECTION SETTINGS
# ============================================================================

# Maximum number of concurrent connections
max_connections = 200

# Superuser reserved connections
superuser_reserved_connections = 3

# ============================================================================
# MEMORY SETTINGS
# ============================================================================

# Shared memory buffer (25% of RAM for development)
shared_buffers = 256MB

# Effective cache size (50-75% of RAM)
effective_cache_size = 1GB

# Maintenance work memory (for VACUUM, CREATE INDEX, etc.)
maintenance_work_mem = 64MB

# Work memory per operation
work_mem = 4MB

# ============================================================================
# WRITE AHEAD LOG (WAL) SETTINGS
# ============================================================================

# WAL buffer size
wal_buffers = 16MB

# Minimum WAL size
min_wal_size = 1GB

# Maximum WAL size
max_wal_size = 4GB

# Checkpoint completion target (0.9 = 90% of checkpoint interval)
checkpoint_completion_target = 0.9

# ============================================================================
# QUERY PLANNER SETTINGS
# ============================================================================

# Default statistics target for query planner
default_statistics_target = 100

# Random page cost (lower for SSD)
random_page_cost = 1.1

# Effective I/O concurrency (for SSD)
effective_io_concurrency = 200

# ============================================================================
# LOGGING SETTINGS
# ============================================================================

# Log destination
log_destination = 'stderr'

# Logging collector
logging_collector = on

# Log directory
log_directory = 'pg_log'

# Log filename pattern
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'

# Log rotation
log_rotation_age = 1d
log_rotation_size = 100MB

# Log line prefix
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# Log slow queries (queries taking longer than 1 second)
log_min_duration_statement = 1000

# Log connections and disconnections
log_connections = on
log_disconnections = on

# Log lock waits
log_lock_waits = on

# ============================================================================
# AUTOVACUUM SETTINGS
# ============================================================================

# Enable autovacuum
autovacuum = on

# Autovacuum max workers
autovacuum_max_workers = 3

# Autovacuum naptime
autovacuum_naptime = 1min

# ============================================================================
# CLIENT CONNECTION DEFAULTS
# ============================================================================

# Timezone
timezone = 'UTC'

# Locale settings
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

# Default text search configuration
default_text_search_config = 'pg_catalog.english'

# ============================================================================
# LOCK MANAGEMENT
# ============================================================================

# Deadlock timeout
deadlock_timeout = 1s

# ============================================================================
# ERROR REPORTING AND LOGGING
# ============================================================================

# Client min messages
client_min_messages = notice

# Log min messages
log_min_messages = warning

# Log min error statement
log_min_error_statement = error

# ============================================================================
# STATEMENT BEHAVIOR
# ============================================================================

# Statement timeout (0 = disabled)
statement_timeout = 0

# Lock timeout (0 = disabled)
lock_timeout = 0

# Idle in transaction session timeout (10 minutes)
idle_in_transaction_session_timeout = 600000

# ============================================================================
# PERFORMANCE MONITORING
# ============================================================================

# Track activity query size
track_activity_query_size = 2048

# Track counts
track_counts = on

# Track functions
track_functions = all

# Track IO timing
track_io_timing = on

# ============================================================================
# REPLICATION (Disabled for local development)
# ============================================================================

# WAL level (minimal for local development)
wal_level = replica

# Max WAL senders (for future replication setup)
max_wal_senders = 0

# ============================================================================
# BACKGROUND WRITER
# ============================================================================

# Background writer delay
bgwriter_delay = 200ms

# Background writer LRU maxpages
bgwriter_lru_maxpages = 100

# Background writer LRU multiplier
bgwriter_lru_multiplier = 2.0

# ============================================================================
# COST-BASED VACUUM DELAY
# ============================================================================

# Vacuum cost delay
vacuum_cost_delay = 0

# Vacuum cost page hit
vacuum_cost_page_hit = 1

# Vacuum cost page miss
vacuum_cost_page_miss = 10

# Vacuum cost page dirty
vacuum_cost_page_dirty = 20

# Vacuum cost limit
vacuum_cost_limit = 200

