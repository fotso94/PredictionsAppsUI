# Redis Configuration for Soccer Predictions Platform
# Optimized for local development with session management and caching

# ============================================================================
# NETWORK SETTINGS
# ============================================================================

# Bind to all interfaces (Docker networking)
bind 0.0.0.0

# Protected mode (disabled for Docker)
protected-mode no

# Port
port 6379

# TCP backlog
tcp-backlog 511

# Timeout (0 = no timeout)
timeout 0

# TCP keepalive
tcp-keepalive 300

# ============================================================================
# GENERAL SETTINGS
# ============================================================================

# Daemonize (no for Docker)
daemonize no

# Supervised (no for Docker)
supervised no

# PID file
pidfile /var/run/redis_6379.pid

# Log level (debug, verbose, notice, warning)
loglevel notice

# Log file (empty string = stdout)
logfile ""

# Databases (16 databases: 0-15)
databases 16

# ============================================================================
# SNAPSHOTTING (PERSISTENCE)
# ============================================================================

# Save the DB on disk
# save <seconds> <changes>
# After 900 sec (15 min) if at least 1 key changed
save 900 1
# After 300 sec (5 min) if at least 10 keys changed
save 300 10
# After 60 sec if at least 10000 keys changed
save 60 10000

# Stop writes on BGSAVE error
stop-writes-on-bgsave-error yes

# Compress string objects using LZF
rdbcompression yes

# Checksum RDB files
rdbchecksum yes

# RDB filename
dbfilename dump.rdb

# Working directory
dir /data

# ============================================================================
# REPLICATION (Disabled for local development)
# ============================================================================

# Replica read-only
replica-read-only yes

# ============================================================================
# SECURITY
# ============================================================================

# Require password (disabled for local development)
# requirepass your_password_here

# Rename dangerous commands (disabled for local development)
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""

# ============================================================================
# MEMORY MANAGEMENT
# ============================================================================

# Max memory (512MB for local development)
maxmemory 512mb

# Max memory policy (evict least recently used keys with TTL)
maxmemory-policy allkeys-lru

# Max memory samples
maxmemory-samples 5

# ============================================================================
# LAZY FREEING
# ============================================================================

# Lazy freeing (async deletion)
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# ============================================================================
# APPEND ONLY MODE (AOF)
# ============================================================================

# Enable AOF (disabled for local development, using RDB only)
appendonly no

# AOF filename
appendfilename "appendonly.aof"

# AOF fsync policy (everysec, always, no)
appendfsync everysec

# No fsync on rewrite
no-appendfsync-on-rewrite no

# Auto AOF rewrite percentage
auto-aof-rewrite-percentage 100

# Auto AOF rewrite min size
auto-aof-rewrite-min-size 64mb

# Load truncated AOF
aof-load-truncated yes

# Use RDB preamble in AOF
aof-use-rdb-preamble yes

# ============================================================================
# LUA SCRIPTING
# ============================================================================

# Lua time limit (milliseconds)
lua-time-limit 5000

# ============================================================================
# SLOW LOG
# ============================================================================

# Slow log threshold (microseconds)
slowlog-log-slower-than 10000

# Slow log max length
slowlog-max-len 128

# ============================================================================
# LATENCY MONITOR
# ============================================================================

# Latency monitor threshold (milliseconds)
latency-monitor-threshold 0

# ============================================================================
# EVENT NOTIFICATION
# ============================================================================

# Keyspace notifications (disabled by default)
notify-keyspace-events ""

# ============================================================================
# ADVANCED CONFIG
# ============================================================================

# Hash max ziplist entries
hash-max-ziplist-entries 512

# Hash max ziplist value
hash-max-ziplist-value 64

# List max ziplist size
list-max-ziplist-size -2

# List compress depth
list-compress-depth 0

# Set max intset entries
set-max-intset-entries 512

# Sorted set max ziplist entries
zset-max-ziplist-entries 128

# Sorted set max ziplist value
zset-max-ziplist-value 64

# HyperLogLog sparse max bytes
hll-sparse-max-bytes 3000

# Stream node max bytes
stream-node-max-bytes 4096

# Stream node max entries
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Hz (internal cron frequency)
hz 10

# Dynamic Hz
dynamic-hz yes

# AOF rewrite incremental fsync
aof-rewrite-incremental-fsync yes

# RDB save incremental fsync
rdb-save-incremental-fsync yes

# ============================================================================
# ACTIVE DEFRAGMENTATION (Disabled for local development)
# ============================================================================

# Active defragmentation
activedefrag no

# ============================================================================
# CUSTOM SETTINGS FOR SOCCER PREDICTIONS PLATFORM
# ============================================================================

# Database allocation:
# DB 0: User sessions and authentication tokens
# DB 1: Prediction caching
# DB 2: Expert tools cache
# DB 3: ML model predictions cache
# DB 4: Real-time match data
# DB 5: API rate limiting
# DB 6-15: Reserved for future use

