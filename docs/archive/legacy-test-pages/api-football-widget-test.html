<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API-Football Widget Test - Predictions Platform</title>
  
  <!-- Bootstrap CSS & JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
    crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous" />
  
  <!-- API-Sports Widgets -->
  <script type="module" crossorigin src="https://widgets.api-sports.io/3.1.0/widgets.js"></script>
  
  <!-- Inline CSS -->
  <style>
    body {
      margin: 0;
    }

    .container-fluid,
    .content {
      max-width: 1440px;
      margin: auto;
    }

    #game-content {
      position: sticky;
      top: 70px;
      overflow-y: auto;
    }

    #game-content api-sports-widget {
      max-height: calc(100vh - 100px);
    }

    #standings-content api-sports-widget,
    #team-content api-sports-widget {
      margin-bottom: 1rem;
      max-height: 55vh;
    }

    #leagues-list {
      position: sticky;
      top: 70px;
      overflow-y: auto;
    }

    .navbar-brand {
      font-weight: bold;
      font-size: 1.5rem;
    }

    .card {
      margin-bottom: 1rem;
    }
  </style>
</head>

<body>
  <!-- Navigation Bar -->
  <nav class="header navbar navbar-expand-lg bg-body-tertiary sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">⚽ Predictions Platform</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" data-sport="football" href="#">Football</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-sport="baseball" href="#">Baseball</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-sport="basketball" href="#">Basketball</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-sport="handball" href="#">Handball</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-sport="hockey" href="#">Hockey</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-sport="rugby" href="#">Rugby</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-sport="volleyball" href="#">Volleyball</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="content p-3">
    <div class="row">

      <!-- Left Column: Leagues List -->
      <div class="col-3">
        <div id="leagues-list" class="card text-bg-dark border-dark">
          <div class="card-body p-0">
            <api-sports-widget data-type="leagues"></api-sports-widget>
          </div>
        </div>
      </div>

      <!-- Middle Column: Games/Fixtures List -->
      <div class="col-5">
        <div id="games-list" class="card text-bg-dark border-dark">
          <div class="card-body p-0">
            <div id="games-list">
              <api-sports-widget data-type="games"></api-sports-widget>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Column: Dynamic Content (Standings, Team, Game Details) -->
      <div class="col-4">

        <!-- Dynamic Targeting Containers -->
        <div class="card text-bg-dark border-dark">
          <div class="card-body p-0">
            <div id="standings-content"></div>
          </div>
        </div>
        
        <div class="card text-bg-dark border-dark">
          <div class="card-body p-0">
            <div id="team-content"></div>
          </div>
        </div>

        <!-- Game Details -->
        <div id="game-content" class="card text-bg-dark border-dark">
          <div class="card-body p-0">
            <api-sports-widget data-type="game" data-game-id="977705"></api-sports-widget>
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- Widget Configuration -->
  <api-sports-widget 
    data-type="config" 
    data-sport="football" 
    data-key="<API_FOOTBALL_KEY_REDACTED>" 
    data-lang="en"
    data-theme="grey" 
    data-show-error="true" 
    data-show-logos="true" 
    data-refresh="20" 
    data-favorite="true"
    data-player-trophies="true" 
    data-standings="true" 
    data-player-injuries="true" 
    data-team-squad="true"
    data-team-statistics="true" 
    data-player-statistics="true" 
    data-tab="games" 
    data-game-tab="statistics"
    data-target-player="modal" 
    data-target-league="#games-list" 
    data-target-team="#team-content"
    data-target-game="#game-content .card-body" 
    data-target-standings="#standings-content"
  ></api-sports-widget>

  <!-- JavaScript for Sport Switching -->
  <script>
    document.addEventListener('click', function (event) {

      if (!event.target.matches('.nav-link')) return
      event.preventDefault()

      // Remove active class from all nav links
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.remove('active');
      });

      // Add active class to clicked link
      event.target.classList.add('active');

      let sport = event.target.getAttribute('data-sport')

      // Update config widget
      let widget = document.querySelector('api-sports-widget[data-type="config"]');
      widget.setAttribute('data-sport', sport);

      // Update leagues widget
      let leagues = document.querySelector('api-sports-widget[data-type="leagues"]');
      leagues.innerHTML = ''
      leagues.setAttribute('data-sport', sport)
      leagues.connectedCallback()

      // Update games widget
      let games = document.querySelector('api-sports-widget[data-type="games"]');
      games.innerHTML = ''
      games.setAttribute('data-sport', sport)
      games.connectedCallback()

      // Update game widget
      let game = document.querySelector('api-sports-widget[data-type="game"]');
      game.innerHTML = ''
      game.setAttribute('data-sport', sport)
      game.connectedCallback()

      // Trigger DOM content loaded event
      window.document.dispatchEvent(new Event("DOMContentLoaded", {
        bubbles: true,
        cancelable: true
      }));
    })

    // Log when page is ready
    document.addEventListener('DOMContentLoaded', function() {
      console.log('✅ API-Football Widgets Test Page Loaded');
      console.log('🔑 API Key: <API_FOOTBALL_KEY_REDACTED>');
      console.log('⚽ Default Sport: Football');
      console.log('📊 Widgets: Leagues, Games, Standings, Team, Game Details');
      console.log('🔄 Auto-refresh: Every 20 seconds');
    });
  </script>

</body>

</html>
