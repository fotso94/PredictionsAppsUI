<!DOCTYPE html>
<html>
<head>
    <title>Test Login</title>
</head>
<body>
    <h1>Testing Login and Token Storage</h1>
    <button onclick="testLogin()">Test Login</button>
    <button onclick="checkTokens()">Check Tokens</button>
    <button onclick="clearTokens()">Clear Tokens</button>
    <pre id="output"></pre>

    <script>
        const output = document.getElementById('output');
        
        async function testLogin() {
            try {
                const response = await fetch('http://localhost:8000/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'testuser7@example.com',
                        password: 'password123'
                    })
                });
                
                const data = await response.json();
                output.textContent = 'Login Response:\n' + JSON.stringify(data, null, 2);
                
                // Store tokens
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('refresh_token', data.refresh_token);
                output.textContent += '\n\nTokens stored in localStorage!';
            } catch (error) {
                output.textContent = 'Error: ' + error.message;
            }
        }
        
        function checkTokens() {
            const accessToken = localStorage.getItem('access_token');
            const refreshToken = localStorage.getItem('refresh_token');
            output.textContent = 'Tokens in localStorage:\n' +
                'Access Token: ' + (accessToken ? accessToken.substring(0, 50) + '...' : 'NOT FOUND') + '\n' +
                'Refresh Token: ' + (refreshToken ? refreshToken.substring(0, 50) + '...' : 'NOT FOUND');
        }
        
        function clearTokens() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            output.textContent = 'Tokens cleared!';
        }
        
        // Check on load
        window.onload = checkTokens;
    </script>
</body>
</html>
